# New machine: install mise (curl https://mise.run | sh), then
# $ mise run setup

[tasks.setup]
description = "Set up this machine: link dotfiles, install tools, set up Herdr"
run = ["stow -v .", "mise install", "mise run herdr:setup"]

[tasks."skills:link"]
description = "Link every .agents/skills/* into .claude/skills (committed symlinks), then restow"
run = """
for skill in .agents/skills/*/; do
  name=$(basename "$skill")
  ln -sfnv "../../.agents/skills/$name" ".claude/skills/$name"
done
stow -R -v .
"""

[tasks.completions]
description = "Generate fish shell completions"
run = [
  "mise completion fish > .config/fish/completions/mise.fish",
  "pnpm completion fish > .config/fish/completions/pnpm.fish",
  "codex completion fish > .config/fish/completions/codex.fish",
  "grok completions fish > .config/fish/completions/grok.fish",
  "glow completion fish > .config/fish/completions/glow.fish"
]

[tasks.pgcli]
description = "Install pgcli tool"
run = "uv tool install pgcli"

[tasks.gems]
description = "Install gems for Ruby on Rails development"
run = """
gem install bundler-audit herb i18n-tasks irb-fzf-history neovim \
  rubocop rubocop-minitest rubocop-performance rubocop-rails \
  rubocop-rails-omakase ruby-lsp ruby-lsp-rails
"""

[tasks."chrome-headless"]
description = "Download the latest chrome driver and headless shell"
dir = "/tmp"
run = """
version=$(curl https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | jq -r '.channels.Stable.version')
curl -O https://storage.googleapis.com/chrome-for-testing-public/$version/win64/chromedriver-win64.zip
curl -O https://storage.googleapis.com/chrome-for-testing-public/$version/linux64/chrome-headless-shell-linux64.zip
unzip -u chromedriver-win64.zip
unzip -u chrome-headless-shell-linux64.zip
rm -rf ~/.local/bin/chrome-headless-shell-linux64/
mv -v chromedriver-win64/chromedriver.exe "`readlink $(which chromedriver)`"
mv -v chrome-headless-shell-linux64/ ~/.local/bin/
"""

[tasks."herdr:pull"]
description = "Copy Herdr app config (Windows) into dotfiles"
run = "bin/herdr-config pull"

[tasks."herdr:push"]
description = "Copy Herdr app config from dotfiles to Windows"
run = "bin/herdr-config push"

[tasks."herdr:link"]
description = "Put herdr-app (the Windows app) on PATH as ~/.local/bin/herdr-app"
run = "bin/herdr-config link"

[tasks."herdr:connect"]
description = "Make this WSL distro a Herdr machine (sshd, key, ssh Host, hc machine add)"
run = "bin/herdr-connect-wsl"

[tasks."herdr:setup"]
description = "Set up Herdr: link herdr-app, connect this distro, push the config"
run = ["mise run herdr:link", "mise run herdr:connect", "mise run herdr:push"]
